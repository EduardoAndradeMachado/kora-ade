name: Release

# Uma tag v* (ex.: v0.1.2) gera o instalador a partir do código dessa tag e publica a Release com o latest.yml,
# que é o arquivo que o atualizador do app consulta. A versão da tag precisa ser a mesma do package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # As notas comparam com a tag anterior: precisa do histórico e das tags.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O relay é um pacote à parte (vai sozinho para o contêiner); os testes dele precisam das dependências dele.
      - run: pnpm install --frozen-lockfile --dir relay
      - run: pnpm exec playwright install --only-shell chromium
      - name: Tag e package.json com a mesma versão
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - run: pnpm check
      # O APK do celular vai dentro do instalador (resources/android) e o Kora do PC o entrega ao app. A chave é
      # sempre a mesma: com outra, o Android recusa instalar por cima do app que já está no celular.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Chave de assinatura do app Android
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kora-celular.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=kora-celular\nkeyPassword=%s\n' \
            "$(cygpath -m "$RUNNER_TEMP/kora-celular.jks")" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          echo "KORA_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: pnpm android
      - run: node scripts/pdfjs-assets.ts
      - run: pnpm exec electron-vite build
      - name: Notas da Release pelos commits desde a tag anterior
        shell: bash
        run: node scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md && cat release-notes.md
      # O electron-builder cria a Release em paralelo para cada arquivo e às vezes cria duas com a mesma tag
      # (aconteceu na 0.1.1 e na 0.1.2): a "última" podia ficar só com o .blockmap e o atualizador recebia 404
      # no latest.yml. Com um rascunho já criado, ele só envia os arquivos para ele.
      - name: Cria a Release como rascunho
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Nome fixo: o README aponta para releases/latest/download/Kora-Celular.apk na primeira instalação do app.
      # Depois disso o app se atualiza pelo Kora do PC, que leva o mesmo APK dentro do instalador.
      - name: APK do celular na Release
        shell: bash
        run: cp resources/android/kora-celular.apk Kora-Celular.apk && gh release upload "$GITHUB_REF_NAME" Kora-Celular.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confere uma Release só, com instalador, blockmap e latest.yml, e publica
        shell: bash
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          [ "$count" = 1 ] || { echo "esperava 1 Release para $GITHUB_REF_NAME, achei $count"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          assets=" $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tr '\n' ' ')"
          for file in "Kora-ADE-Setup-$version.exe" "Kora-ADE-Setup-$version.exe.blockmap" latest.yml Kora-Celular.apk; do
            case "$assets" in *" $file "*) ;; *) echo "falta $file na Release (tem:$assets)"; exit 1 ;; esac
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
