name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Windows: node-pty/ConPTY, o Restart Manager e o Toolhelp que os testes exercitam só existem nele.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
